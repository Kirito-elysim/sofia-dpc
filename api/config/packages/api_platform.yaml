api_platform:
    title: SOFIA / PHOCEA
    version: 1.0.0
    path_segment_name_generator: api_platform.metadata.path_segment_name_generator.dash
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    # Referentials are small; plain-JSON collections are returned whole (no paging). Revisit for classes/enrollments.
    exception_to_status:
        Doctrine\DBAL\Exception\ForeignKeyConstraintViolationException: 409
    defaults:
        pagination_enabled: false
        stateless: false # session cookie auth
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
